[workspace]
resolver = "3"
members = ["libs/labels", "libs/labeld", "libs/host", "libs/gate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
fewshot-labels = { path = "libs/labels" }
fewshot-labeld = { path = "libs/labeld" }
fewshot-host = { path = "libs/host", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
proptest = "1.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
